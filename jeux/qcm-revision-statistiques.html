<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM de révision — Statistiques à deux variables</title>
<style>
  :root{
    --bg: #171a21;
    --paper: #ffffff;
    --paper-line: #dfe3ea;
    --ink: #232733;
    --accent: #1F4E78;
    --accent-2: #C55A11;
    --ok: #2f8f5b;
    --bad: #c0392b;
    --muted: #6b7386;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "Courier New", ui-monospace, Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(circle at 15% 0%, #1e2230 0%, var(--bg) 60%);
    font-family: var(--sans); color: var(--ink);
    padding: 26px 16px 60px;
  }
  .wrap{ max-width: 820px; margin:0 auto; }

  header{ text-align:center; margin-bottom: 24px; color:#ECE8DC; }
  header h1{ font-size: 1.5rem; margin: 0 0 6px; }
  header p{ margin:0; color:#9aa2b3; font-size:.92rem; }

  .progress-wrap{
    background:#12141a; border-radius: 20px; height: 10px; margin: 18px 0 30px; overflow:hidden;
    border:1px solid #3a4152;
  }
  .progress-bar{ height:100%; background: linear-gradient(90deg, var(--accent-2), #e8b84b); width:0%; transition: width .3s ease; }
  .progress-label{ text-align:center; color:#9aa2b3; font-size:.8rem; font-family: var(--mono); margin-top:-22px; margin-bottom: 26px; }

  .part-header{
    color:#ECE8DC; font-size:1.05rem; font-weight:700; margin: 30px 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .part-header .badge{
    background: var(--accent-2); color:white; font-size:.7rem; padding: 3px 9px; border-radius: 20px;
    font-family: var(--mono); letter-spacing:.5px;
  }

  .qcard{
    background: var(--paper); border-radius:8px; padding: 20px 22px; margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,.25); border: 1px solid var(--paper-line);
  }
  .qnum{ font-family: var(--mono); font-size:.75rem; color: var(--muted); margin-bottom:6px; }
  .qtext{ font-weight:600; margin: 0 0 14px; line-height:1.45; }
  .opt{
    display:flex; align-items:flex-start; gap:10px; padding: 9px 10px; border-radius:6px;
    cursor:pointer; margin-bottom:6px; border:1px solid transparent; transition: background .12s ease;
  }
  .opt:hover{ background:#f4f6f9; }
  .opt input{ margin-top:3px; }
  .opt label{ cursor:pointer; line-height:1.4; }

  .qcard.correct{ border-color: var(--ok); background: #f0f9f3; }
  .qcard.incorrect{ border-color: var(--bad); background: #fbf1f0; }
  .opt.answer-correct label{ color: var(--ok); font-weight:700; }
  .opt.answer-wrong-selected label{ color: var(--bad); font-weight:700; text-decoration: line-through; }

  .explain{
    display:none; margin-top: 12px; padding: 10px 12px; border-radius:6px;
    background:#eef2f7; font-size:.87rem; color:#374151; line-height:1.5;
    border-left: 3px solid var(--accent);
  }
  .qcard.checked .explain{ display:block; }

  .actions{ text-align:center; margin: 34px 0 10px; }
  button.primary{
    background: var(--accent); color:white; border:none; border-radius:8px;
    padding: 14px 30px; font-size: 1rem; font-weight:700; cursor:pointer; font-family: inherit;
  }
  button.primary:hover{ background:#173d5e; }
  button.ghost{
    background:transparent; border:1px solid #6b7386; color:#ECE8DC; border-radius:8px;
    padding: 10px 20px; font-size:.9rem; cursor:pointer; font-family: inherit; margin-left: 10px;
  }

  .score-panel{
    text-align:center; background:#ffffff; border-radius:10px; padding: 26px; margin: 0 0 26px;
    box-shadow: 0 10px 26px rgba(0,0,0,.3);
  }
  .score-panel .big{ font-size: 2.6rem; font-weight:800; margin: 8px 0; }
  .score-panel .msg{ font-size: 1.05rem; margin-bottom: 4px; }
  .score-good{ color: var(--ok); }
  .score-mid{ color: var(--accent-2); }
  .score-low{ color: var(--bad); }

  footer{ text-align:center; color:#8b93a3; font-size:.75rem; margin-top: 30px; font-family: var(--mono); line-height:1.8; }

/* ---- Navbar retour accueil ---- */
.site-navbar{
  position: sticky; top: 0; z-index: 999;
  background: #16232F; color:#E4EAEF;
  padding: 0.65rem 1.2rem;
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.78rem;
  display:flex; align-items:center;
}
.site-navbar a{
  color:#E4EAEF; text-decoration:none; font-weight:600;
  display:inline-flex; align-items:center; gap:0.4rem;
  transition: color .15s ease;
}
.site-navbar a:hover{ color:#F2A93B; }

</style>
</head>
<body>
<div class="site-navbar"><a href="../index.html">&#8592; Retour à l'accueil</a></div>
<div class="wrap">
  <header>
    <h1>QCM de révision — Statistiques à deux variables</h1>
    <p>Répondez à toutes les questions puis cliquez sur « Corriger » en bas de page.</p>
  </header>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-label" id="progressLabel">0 / 13 questions répondues</div>

  <div id="scoreZone"></div>

  <div id="quizZone"></div>

  <div class="actions">
    <button class="primary" id="correctBtn">Corriger</button>
    <button class="ghost" id="resetBtn">Recommencer</button>
  </div>

  <footer>QCM de révision — statistiques à deux variables.<br>Conçu par Mme Boudier (à l'aide d'une IA, soyons réalistes).</footer>
</div>

<script>
const questions = [
  // ---------------- PARTIE 1 : QUESTIONS DE COURS ----------------
  {
    part: 1,
    text: "Dans l'équation d'une droite d'ajustement affine y = ax + b, que représente le nombre a ?",
    options: [
      "L'ordonnée à l'origine de la droite",
      "Le coefficient directeur (la pente) de la droite",
      "Le coefficient de détermination de l'ajustement"
    ],
    correct: 1,
    explain: "a est le coefficient directeur (la pente) de la droite ; b est l'ordonnée à l'origine."
  },
  {
    part: 1,
    text: "Que représente le nombre b dans l'équation y = ax + b ?",
    options: [
      "Le coefficient directeur de la droite",
      "L'ordonnée à l'origine de la droite",
      "La valeur du coefficient R²"
    ],
    correct: 1,
    explain: "b est l'ordonnée à l'origine : la valeur de y lorsque x = 0."
  },
  {
    part: 1,
    text: "Une série statistique double associe, à chaque individu ou chaque instant observé :",
    options: [
      "une seule valeur numérique",
      "deux valeurs numériques (x ; y)",
      "uniquement un rang"
    ],
    correct: 1,
    explain: "C'est justement ce qui définit une série statistique double (ou à deux variables) : à chaque observation correspond un couple (x ; y)."
  },
  {
    part: 1,
    text: "Pour qu'un ajustement affine ait du sens, le nuage de points doit avoir une forme :",
    options: [
      "allongée, avec des points resserrés autour d'une droite imaginaire",
      "obligatoirement circulaire",
      "peu importe : on peut toujours réaliser un ajustement affine"
    ],
    correct: 0,
    explain: "Si le nuage n'a pas une forme allongée (courbe, dispersé, en plusieurs paquets...), un ajustement affine n'a pas de sens, quel que soit le R² obtenu."
  },
  {
    part: 1,
    text: "Le coefficient de détermination R² permet d'évaluer :",
    options: [
      "le nombre de points du nuage",
      "la pertinence (la qualité) de l'ajustement affine",
      "uniquement la valeur du coefficient directeur a"
    ],
    correct: 1,
    explain: "R², compris entre 0 et 1, mesure à quel point l'ajustement affine représente bien la tendance du nuage de points."
  },
  {
    part: 1,
    text: "Vrai ou faux : plus R² est proche de 0, plus l'ajustement affine est pertinent.",
    options: [
      "Vrai",
      "Faux"
    ],
    correct: 1,
    explain: "C'est l'inverse : plus R² est proche de 1, plus l'ajustement affine est pertinent."
  },

  // ---------------- PARTIE 2 : QUESTIONS PLUS POUSSÉES ----------------
  {
    part: 2,
    text: "Un chocolatier a relevé, un hiver, le nombre de chocolats chauds vendus selon la température extérieure. L'ajustement affine donne un coefficient directeur a = −18. Que peut-on en déduire ?",
    options: [
      "Plus il fait froid, plus les ventes de chocolat chaud augmentent",
      "Plus il fait froid, moins on vend de chocolat chaud",
      "La température n'a aucune influence sur les ventes"
    ],
    correct: 0,
    explain: "a est négatif : quand la température (x) augmente, les ventes (y) diminuent. Donc quand la température diminue (il fait plus froid), les ventes augmentent."
  },
  {
    part: 2,
    text: "Un maraîcher étudie le rendement de tomates (y) selon la quantité d'eau apportée (x). Le nuage de points obtenu est très dispersé, sans tendance visible, et R² = 0,08. Que doit-il en conclure ?",
    options: [
      "Il peut utiliser l'ajustement affine quand même, R² n'a pas d'importance ici",
      "Un ajustement affine n'est pas adapté : la relation entre les deux variables n'est pas de nature affine (ou inexistante avec ces données)",
      "Il doit recalculer R² avec une autre formule pour obtenir un résultat plus élevé"
    ],
    correct: 1,
    explain: "Un R² aussi faible signifie que la droite d'ajustement ne représente pas du tout la tendance du nuage : il ne faut pas l'utiliser pour faire des prévisions."
  },
  {
    part: 2,
    text: "Une étude relève une excellente corrélation (R² = 0,97) entre le nombre de glaces vendues sur une plage et le nombre de noyades déclarées le même mois. Peut-on en conclure que manger une glace cause des noyades ?",
    options: [
      "Oui, un R² aussi élevé prouve un lien de cause à effet",
      "Non, une forte corrélation ne prouve pas un lien de cause à effet (ici, c'est la chaleur estivale qui explique les deux à la fois)",
      "Non, car pour être valable R² devrait être négatif"
    ],
    correct: 1,
    explain: "Un R² élevé montre une corrélation statistique, mais ne prouve jamais un lien de cause à effet. Ici, un facteur commun (la chaleur, donc plus de monde à la plage) explique les deux variables."
  },
  {
    part: 2,
    text: "On réalise un ajustement affine à partir de données allant de x = 0 à x = 50. Peut-on prédire fiablement la valeur de y pour x = 500 ?",
    options: [
      "Oui, l'équation reste parfaitement valable pour n'importe quelle valeur de x",
      "C'est risqué : il s'agit d'une extrapolation très éloignée de l'intervalle des données connues, la fiabilité diminue fortement",
      "Non, une extrapolation est toujours totalement fausse, quelle que soit la distance"
    ],
    correct: 1,
    explain: "Une extrapolation reste possible mais devient de moins en moins fiable à mesure qu'on s'éloigne de l'intervalle des données observées. x = 500 est dix fois plus loin que la limite connue (50) : la prudence s'impose."
  },
  {
    part: 2,
    text: "On ajoute au nuage de points un point très éloigné de la tendance générale (une valeur aberrante). Quel est l'effet le plus probable sur le coefficient R² ?",
    options: [
      "R² augmente forcément",
      "R² diminue généralement, car ce point s'éloigne de la droite d'ajustement",
      "R² reste rigoureusement identique"
    ],
    correct: 1,
    explain: "Un point éloigné de la tendance générale dégrade la qualité de l'ajustement affine : R² a tendance à diminuer."
  },
  {
    part: 2,
    text: "Parmi ces trois valeurs de R², laquelle correspond au nuage de points le plus proche d'un alignement parfait ?",
    options: [
      "R² = 0,15",
      "R² = 0,52",
      "R² = 0,98"
    ],
    correct: 2,
    explain: "R² = 0,98 est la valeur la plus proche de 1, donc celle qui correspond au nuage le plus aligné."
  },
  {
    part: 2,
    text: "Une entreprise observe que le nombre de réclamations clients (y) diminue lorsque le nombre de formations suivies par les employés (x) augmente. Quel est le signe attendu du coefficient directeur a de la droite d'ajustement ?",
    options: [
      "a > 0",
      "a < 0",
      "Impossible à savoir sans faire le calcul"
    ],
    correct: 1,
    explain: "Quand y diminue alors que x augmente, la relation est décroissante : le coefficient directeur a est négatif."
  },
];

let answers = new Array(questions.length).fill(null);
let corrected = false;

function renderQuiz(){
  const zone = document.getElementById("quizZone");
  let html = "";
  let currentPart = 0;
  questions.forEach((q, i)=>{
    if(q.part !== currentPart){
      currentPart = q.part;
      const label = currentPart === 1 ? "Partie 1 — Questions de cours" : "Partie 2 — Questions plus poussées";
      const badge = currentPart === 1 ? "ÉCHAUFFEMENT" : "APPROFONDISSEMENT";
      html += `<div class="part-header">${label} <span class="badge">${badge}</span></div>`;
    }
    html += `
      <div class="qcard" id="qcard${i}">
        <div class="qnum">Question ${i+1} / ${questions.length}</div>
        <p class="qtext">${q.text}</p>
        <div class="options">
          ${q.options.map((opt,j)=>`
            <div class="opt" data-qi="${i}" data-oi="${j}">
              <input type="radio" name="q${i}" id="q${i}o${j}" value="${j}">
              <label for="q${i}o${j}">${opt}</label>
            </div>
          `).join("")}
        </div>
        <div class="explain" id="explain${i}">💡 ${q.explain}</div>
      </div>
    `;
  });
  zone.innerHTML = html;

  document.querySelectorAll(".opt input").forEach(inp=>{
    inp.addEventListener("change", (e)=>{
      const qi = parseInt(e.target.closest(".opt").dataset.qi);
      const oi = parseInt(e.target.value);
      answers[qi] = oi;
      updateProgress();
    });
  });
}

function updateProgress(){
  const answeredCount = answers.filter(a=>a!==null).length;
  const pct = Math.round((answeredCount/questions.length)*100);
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `${answeredCount} / ${questions.length} questions répondues`;
}

function correctQuiz(){
  corrected = true;
  let score = 0;
  questions.forEach((q,i)=>{
    const card = document.getElementById(`qcard${i}`);
    card.classList.add("checked");
    const userAnswer = answers[i];
    const isCorrect = userAnswer === q.correct;
    if(isCorrect) score++;
    card.classList.add(isCorrect ? "correct" : "incorrect");

    document.querySelectorAll(`.opt[data-qi="${i}"]`).forEach(optEl=>{
      const oi = parseInt(optEl.dataset.oi);
      optEl.querySelector("input").disabled = true;
      if(oi === q.correct){
        optEl.classList.add("answer-correct");
      } else if(oi === userAnswer){
        optEl.classList.add("answer-wrong-selected");
      }
    });
  });

  const total = questions.length;
  let tier = "score-low", msg = "À revoir : reprends le cours et retente le QCM !";
  if(score >= total*0.8){ tier="score-good"; msg="Excellent, la séquence est bien maîtrisée !"; }
  else if(score >= total*0.5){ tier="score-mid"; msg="Pas mal, quelques révisions ciblées et ce sera parfait."; }

  document.getElementById("scoreZone").innerHTML = `
    <div class="score-panel">
      <div class="msg">Résultat</div>
      <div class="big ${tier}">${score} / ${total}</div>
      <div class="msg ${tier}">${msg}</div>
    </div>
  `;
  document.getElementById("scoreZone").scrollIntoView({behavior:"smooth", block:"start"});
  document.getElementById("correctBtn").disabled = true;
}

function resetQuiz(){
  answers = new Array(questions.length).fill(null);
  corrected = false;
  document.getElementById("scoreZone").innerHTML = "";
  document.getElementById("correctBtn").disabled = false;
  renderQuiz();
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("correctBtn").addEventListener("click", correctQuiz);
document.getElementById("resetBtn").addEventListener("click", resetQuiz);

renderQuiz();
</script>
</body>
</html>

    icon:"🔐",
    name:"La Chambre Forte",
    story:"Vous voilà devant le coffre. Un mot griffonné à la hâte indique qu'une fuite a eu lieu : quelqu'un du personnel connaît le vrai code. On note F l'événement « l'employé choisi est une femme » et C l'événement « l'employé choisi connaît le code ». La direction vous a transmis les chiffres : sur les <b>20 employés</b> (visibles sur le plateau ci-dessous, numérotés de 1 à 20), il y a <b>8 femmes</b> et <b>12 hommes</b>. Au total, <b>5 employés</b> sont susceptibles de connaître le vrai code du coffre, dont <b>3 femmes</b>. Vous n'avez droit à aucune erreur : un mauvais chiffre et le mécanisme se bloque définitivement.",
    outro: "Votre complice s'est glissé dans les bureaux de l'administration et a réussi à soutirer le code à la suspecte n°5. Le sésame en main, vous composez fébrilement le code sur le clavier numérique du coffre...",
    questions:[
      {
        type:"qcm",
        text:"Comment note-t-on « la probabilité qu'un employé connaisse le code sachant que c'est une femme » ?",
        options:["P(F) ∩ P(C)","P<sub>F</sub>(C)","P<sub>C</sub>(F)"],
        correct:1,
        explain:"P<sub>F</sub>(C) se lit « probabilité de C sachant F » : on réduit l'univers aux femmes (F), puis on regarde parmi elles celles qui connaissent le code (C)."
      },
      {
        type:"numeric",
        text:"Combien d'hommes connaissent le code ?",
        answer:2,
        explain:"5 − 3 = 2 hommes connaissent le code. Le plateau s'éclaircit : les 15 employés qui ne connaissent pas le code sont écartés de l'enquête.",
        eliminateIds: NON_SUSPECTS
      },
      {
        type:"fraction",
        text:"Calculez P<sub>F</sub>(C), la probabilité qu'un employé connaisse le code sachant que c'est une femme. Donnez la fraction complète (numérateur / dénominateur).",
        num:3, den:8,
        explain:"P<sub>F</sub>(C) = (femmes qui connaissent le code) / (total des femmes) = 3/8."
      },
      {
        type:"fraction",
        text:"Calculez maintenant P<sub>H</sub>(C), la probabilité qu'un employé connaisse le code sachant que c'est un homme. Donnez la fraction complète, sans la simplifier.",
        num:2, den:12,
        explain:"P<sub>H</sub>(C) = (hommes qui connaissent le code) / (total des hommes) = 2/12."
      },
      {
        type:"qcm",
        text:"En comparant P<sub>F</sub>(C) = 3/8 = 0,375 et P<sub>H</sub>(C) = 2/12 ≈ 0,167, dans quel groupe a-t-on le plus de chances de tomber sur la personne susceptible de connaître le code et de vous le vendre ?",
        options:["Les femmes","Les hommes","Impossible à dire"],
        correct:0,
        explain:"0,375 > 0,167 : proportionnellement, davantage de femmes sont susceptibles de connaître le code. Les 2 suspects masculins restants sont innocentés : il ne reste que 3 suspectes.",
        eliminateIds: HOMMES_SUSPECTS
      },
      {
        type:"numeric",
        text:"Un dernier indice tombe : seul le personnel de l'administration avait accès au boîtier de sécurité trafiqué. Parmi les 3 suspectes restantes, deux travaillent à la salle de jeux (cartes n°2 et n°8) : elles sont innocentées. Quel est le numéro de la suspecte qui reste, celle qui va vous vendre le code ?",
        answer:5,
        explain:"Il ne reste que la suspecte n°5, employée de l'administration : c'est elle qui va vous vendre le code. C'est le 5ᵉ et dernier chiffre du code !",
        eliminateIds: FEMMES_SALLE_DE_JEUX
      }
    ]
  }
];

const VAULT_CODE = STAGES.map(s => String(s.questions[s.questions.length-1].answer)).join("");

const TENSION_MESSAGES = [
  {at:25*60, msg:"⏱️ Encore 25 minutes avant la relève de la sécurité."},
  {at:20*60, msg:"🎲 20 minutes... la partie continue, restez discrets."},
  {at:15*60, msg:"🚨 Un vigile vient de repasser près du hall. Restez concentrés !"},
  {at:10*60, msg:"⏱️ Plus que 10 minutes avant le changement d'équipe."},
  {at:5*60, msg:"🔴 Les caméras redémarrent dans 5 minutes. Accélérez !"},
  {at:60, msg:"🔴 Une minute. C'est maintenant ou jamais."}
];
const TOTAL_DURATION = 30*60;

/* ---------- ÉTAT ---------- */
let state = {
  screen:"intro", // intro | stage | outro | vault | success
  stageIndex:0,
  qIndex:0,
  answered:false,
  collectedDigits:[],
  teamName:"",
  startTime:null,
  timeLeft:TOTAL_DURATION,
  timerId:null,
  tensionHideTimeout:null,
  triggeredTensions:new Set(),
  eliminated:new Set()
};

const app = document.getElementById("app");
const progressBar = document.getElementById("progressBar");
const codebook = document.getElementById("codebook");
const timerDisplay = document.getElementById("timerDisplay");
const tensionBar = document.getElementById("tensionBar");
const suspectBoardWrap = document.getElementById("suspectBoardWrap");

/* ---------- MINUTEUR (basé sur l'horloge réelle pour rester fiable) ---------- */
function formatTime(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function showTension(msg){
  tensionBar.textContent = msg;
  tensionBar.classList.add("show");
  if(state.tensionHideTimeout) clearTimeout(state.tensionHideTimeout);
  state.tensionHideTimeout = setTimeout(()=>{
    tensionBar.classList.remove("show");
  }, 60000);
}
function startTimer(){
  if(state.timerId) return;
  state.timerId = setInterval(()=>{
    const elapsedReal = Math.floor((Date.now()-state.startTime)/1000);
    const remaining = Math.max(0, TOTAL_DURATION - elapsedReal);
    if(remaining !== state.timeLeft){
      state.timeLeft = remaining;
      timerDisplay.textContent = formatTime(state.timeLeft);
      timerDisplay.classList.toggle("low", state.timeLeft<=120);
      TENSION_MESSAGES.forEach(t=>{
        if(state.timeLeft<=t.at && !state.triggeredTensions.has(t.at)){
          state.triggeredTensions.add(t.at);
          showTension(t.msg);
        }
      });
    }
    if(remaining<=0){
      clearInterval(state.timerId);
      tensionBar.textContent = "🚨 Temps écoulé ! La relève arrive... tentez d'ouvrir le coffre au plus vite !";
      tensionBar.classList.add("show");
    }
  },500);
}

/* ---------- PROGRESS + CODEBOOK ---------- */
function renderProgress(){
  progressBar.innerHTML = "";
  STAGES.forEach((s,i)=>{
    const div = document.createElement("div");
    const isDone = i<state.stageIndex || state.screen==="vault" || state.screen==="success" || (i===state.stageIndex && state.screen==="outro");
    div.className = "step" + (i===state.stageIndex && state.screen==="stage" ? " active" : "") + (isDone ? " done" : "");
    div.textContent = s.icon;
    progressBar.appendChild(div);
  });
}
function renderCodebook(){
  codebook.innerHTML = "";
  for(let i=0;i<5;i++){
    const d = document.createElement("div");
    d.className = "digit-slot" + (state.collectedDigits[i]!==undefined ? " filled" : "");
    d.textContent = state.collectedDigits[i]!==undefined ? state.collectedDigits[i] : "?";
    codebook.appendChild(d);
  }
}

/* ---------- PLATEAU DES SUSPECTS ---------- */
function renderSuspectBoard(){
  const inChambreForte = state.stageIndex===4 && state.screen==="stage";
  if(!inChambreForte){
    suspectBoardWrap.style.display = "none";
    suspectBoardWrap.innerHTML = "";
    return;
  }
  suspectBoardWrap.style.display = "block";
  const remaining = SUSPECTS.length - state.eliminated.size;
  suspectBoardWrap.innerHTML = `
    <div class="qlabel" style="margin-bottom:10px;">🔎 Plateau des suspects — ${remaining} restant${remaining>1?"s":""}</div>
    <div class="suspect-grid">
      ${SUSPECTS.map(s=>{
        const isElim = state.eliminated.has(s.id);
        const isWinner = !isElim && remaining===1;
        return `<div class="suspect-card ${isElim?"eliminated":""} ${isWinner?"winner":""}">
          <div>${s.gender==="F" ? "👩" : "🧑"}</div>
          <div class="num">#${s.id}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

/* ---------- ÉCRANS ---------- */
function renderIntro(){
  app.innerHTML = `
    <div class="panel center">
      <div class="icon-big">🎰</div>
      <h2>Prêts pour le casse ?</h2>
      <p style="line-height:1.6; margin:14px 0;">
        Votre équipe doit traverser <b>5 salles</b> du Casino Monte-Carlo pour atteindre la chambre forte.
        Dans chaque salle, répondez aux questions de probabilités pour obtenir <b>un chiffre du code final</b>.
        Vous avez <b>30 minutes</b> avant la relève de la sécurité : passé ce délai, impossible de dire ce qu'il vous en coûtera.
        Reconstituez le code à 5 chiffres et ouvrez le coffre avant que le temps ne soit écoulé !
      </p>
      <label class="qlabel" for="teamInput">Nom de votre équipe</label>
      <input type="text" id="teamInput" placeholder="Ex : Les As du Calcul" style="margin:10px 0 18px;">
      <div>
        <button class="btn" id="startBtn">Commencer le casse</button>
      </div>
    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", ()=>{
    const name = document.getElementById("teamInput").value.trim();
    state.teamName = name || "Équipe mystère";
    state.startTime = Date.now();
    state.screen = "stage";
    state.stageIndex = 0;
    state.qIndex = 0;
    state.eliminated = new Set();
    state.triggeredTensions = new Set();
    startTimer();
    render();
  });
}

function renderStage(){
  const stage = STAGES[state.stageIndex];
  const q = stage.questions[state.qIndex];

  let questionHtml = "";
  if(q.type==="qcm"){
    questionHtml = `
      <div class="qlabel">Question ${state.qIndex+1} / ${stage.questions.length}</div>
      <div class="qtext">${q.text}</div>
      <div class="options" id="optionsWrap">
        ${q.options.map((opt,i)=>`<button class="opt" data-i="${i}">${opt}</button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions" id="actionsWrap"></div>
    `;
  } else if(q.type==="fraction"){
    questionHtml = `
      <div class="qlabel">Question ${state.qIndex+1} / ${stage.questions.length}</div>
      <div class="qtext">${q.text}</div>
      <div class="numeric-row">
        <input type="number" id="numInput" placeholder="num">
        <span class="frac-slash">/</span>
        <input type="number" id="denInput" placeholder="dén">
        <button class="btn" id="checkBtn">Valider</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions" id="actionsWrap"></div>
    `;
  } else {
    questionHtml = `
      <div class="qlabel">Question ${state.qIndex+1} / ${stage.questions.length}</div>
      <div class="qtext">${q.text}</div>
      <div class="numeric-row">
        <input type="number" id="numInput" placeholder="?">
        <button class="btn" id="checkBtn">Valider</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions" id="actionsWrap"></div>
    `;
  }

  app.innerHTML = `
    <div class="panel">
      <h2>${stage.icon} ${stage.name}</h2>
      <div class="story">${stage.story}</div>
      ${questionHtml}
    </div>
  `;

  renderSuspectBoard();

  if(q.type==="qcm"){
    document.querySelectorAll("#optionsWrap .opt").forEach(btn=>{
      btn.addEventListener("click", ()=>handleQcmAnswer(parseInt(btn.dataset.i)));
    });
  } else if(q.type==="fraction"){
    document.getElementById("checkBtn").addEventListener("click", handleFractionAnswer);
    document.getElementById("denInput").addEventListener("keydown",(e)=>{
      if(e.key==="Enter") handleFractionAnswer();
    });
  } else {
    document.getElementById("checkBtn").addEventListener("click", handleNumericAnswer);
    document.getElementById("numInput").addEventListener("keydown",(e)=>{
      if(e.key==="Enter") handleNumericAnswer();
    });
  }
}

function applyElimination(q){
  if(q.eliminateIds){
    q.eliminateIds.forEach(id=>state.eliminated.add(id));
    renderSuspectBoard();
  }
}

function showFeedback(ok, text){
  const fb = document.getElementById("feedback");
  fb.className = "feedback show " + (ok?"ok":"bad");
  fb.innerHTML = (ok? "✅ Correct ! " : "❌ Pas tout à fait. ") + text;
  const actions = document.getElementById("actionsWrap");
  if(ok){
    const stage = STAGES[state.stageIndex];
    const isLastQ = state.qIndex === stage.questions.length-1;
    const label = isLastQ ? "Continuer" : "Question suivante";
    actions.innerHTML = `<button class="btn" id="nextBtn">${label}</button>`;
    document.getElementById("nextBtn").addEventListener("click", advance);
  } else {
    actions.innerHTML = "";
  }
}

function handleQcmAnswer(i){
  const stage = STAGES[state.stageIndex];
  const q = stage.questions[state.qIndex];
  const btns = document.querySelectorAll("#optionsWrap .opt");
  btns.forEach(b=>b.disabled=true);
  if(i===q.correct){
    btns[i].classList.add("correct");
    applyElimination(q);
    showFeedback(true, q.explain);
  } else {
    btns[i].classList.add("wrong");
    btns[q.correct].classList.add("correct");
    showFeedback(false, q.explain);
    btns.forEach(b=>b.disabled=false);
  }
}

function handleNumericAnswer(){
  const stage = STAGES[state.stageIndex];
  const q = stage.questions[state.qIndex];
  const input = document.getElementById("numInput");
  const val = parseFloat(input.value);
  const checkBtn = document.getElementById("checkBtn");
  if(val===q.answer){
    input.disabled = true;
    checkBtn.disabled = true;
    applyElimination(q);
    showFeedback(true, q.explain);
    if(state.qIndex === stage.questions.length-1){
      state.collectedDigits[state.stageIndex] = String(q.answer).slice(-1);
      renderCodebook();
    }
  } else {
    showFeedback(false, "Recalculez et réessayez.");
  }
}

function handleFractionAnswer(){
  const stage = STAGES[state.stageIndex];
  const q = stage.questions[state.qIndex];
  const numInput = document.getElementById("numInput");
  const denInput = document.getElementById("denInput");
  const numVal = parseFloat(numInput.value);
  const denVal = parseFloat(denInput.value);
  const checkBtn = document.getElementById("checkBtn");
  if(numVal===q.num && denVal===q.den){
    numInput.disabled = true;
    denInput.disabled = true;
    checkBtn.disabled = true;
    applyElimination(q);
    showFeedback(true, q.explain);
  } else {
    showFeedback(false, "Recalculez le numérateur et le dénominateur, puis réessayez.");
  }
}

function advance(){
  const stage = STAGES[state.stageIndex];
  if(state.qIndex < stage.questions.length-1){
    state.qIndex++;
    render();
  } else {
    state.screen = "outro";
    render();
  }
}

function renderOutro(){
  const stage = STAGES[state.stageIndex];
  const isLastStage = state.stageIndex === STAGES.length-1;
  app.innerHTML = `
    <div class="panel center">
      <div class="icon-big">${stage.icon}</div>
      <h2>${stage.name} — franchie</h2>
      <div class="outro-text">${stage.outro}</div>
      <button class="btn" id="continueBtn">${isLastStage ? "Aller au coffre" : "Salle suivante"}</button>
    </div>
  `;
  document.getElementById("continueBtn").addEventListener("click", ()=>{
    if(state.stageIndex < STAGES.length-1){
      state.stageIndex++;
      state.qIndex=0;
      state.screen="stage";
    } else {
      state.screen="vault";
    }
    render();
  });
}

function renderVault(){
  app.innerHTML = `
    <div class="panel center">
      <div class="icon-big">🔐</div>
      <h2>La chambre forte</h2>
      <p style="line-height:1.6;">Vous avez collecté les 5 chiffres. Un seul essai compte vraiment : entrez le code du coffre pour terminer le casse !</p>
      <div class="vault-input" id="vaultInputs">
        ${[0,1,2,3,4].map(i=>`<input type="text" maxlength="1" inputmode="numeric" data-i="${i}">`).join("")}
      </div>
      <div class="feedback" id="vaultFeedback"></div>
      <div>
        <button class="btn" id="vaultBtn">Ouvrir le coffre</button>
      </div>
    </div>
  `;
  const inputs = document.querySelectorAll("#vaultInputs input");
  inputs.forEach((inp,idx)=>{
    inp.addEventListener("input", ()=>{
      if(inp.value && idx<4) inputs[idx+1].focus();
    });
  });
  document.getElementById("vaultBtn").addEventListener("click", ()=>{
    const code = Array.from(inputs).map(i=>i.value).join("");
    const fb = document.getElementById("vaultFeedback");
    if(code===VAULT_CODE){
      clearInterval(state.timerId);
      state.screen="success";
      render();
    } else {
      fb.className="feedback show bad";
      fb.textContent = "❌ Ce n'est pas le bon code. Revérifiez vos 5 chiffres collectés en haut de l'écran.";
    }
  });
}

function renderSuccess(){
  const elapsed = Math.floor((Date.now()-state.startTime)/1000);
  const elapsedStr = formatTime(elapsed);

  app.innerHTML = `
    <div class="panel center">
      <div class="icon-big">🔓</div>
      <h2>Le coffre s'ouvre...</h2>
      <p style="line-height:1.6;">
        Bravo <b>${escapeHtml(state.teamName)}</b> ! La porte blindée pivote lentement, en <b>${elapsedStr}</b>. À vous la richesse...
      </p>
      <div class="twist">
        🧮 ... sauf qu'à la place des liasses de billets, vous trouvez une pile de <b>copies de probabilités non corrigées</b> et un post-it :
        <br><br>
        <i>« Bien joué, matheux ! Le vrai trésor, c'était les probabilités qu'on a calculées en chemin. Signé : Mme Boudier. »</i>
      </div>
      <button class="btn" id="saveScoreBtn">Enregistrer au classement</button>
      <div class="leaderboard" id="leaderboardWrap"></div>
    </div>
  `;

  const saveBtn = document.getElementById("saveScoreBtn");
  saveBtn.addEventListener("click", ()=>{
    const entries = readScores();
    entries.push({team:state.teamName, seconds:elapsed});
    try{ localStorage.setItem(LB_KEY, JSON.stringify(entries)); }catch(e){}
    saveBtn.disabled = true;
    saveBtn.textContent = "Score enregistré ✓";
    loadLeaderboard();
  });

  loadLeaderboard();
}

/* Classement enregistré sur l'appareil (navigateur) utilisé */
const LB_KEY = "lpqc-casse-casino-scores";
function readScores(){
  try{
    const raw = localStorage.getItem(LB_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function escapeHtml(t){
  return String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function loadLeaderboard(){
  const wrap = document.getElementById("leaderboardWrap");
  if(!wrap) return;
  const entries = readScores().sort((a,b)=>a.seconds-b.seconds);
  if(entries.length===0){
    wrap.innerHTML = "<p class='lb-note'>Aucun score enregistré sur cet appareil pour l'instant.</p>";
    return;
  }
  wrap.innerHTML = `<div class="lb-row"><span>Équipe</span><span>Temps</span></div>` +
    entries.slice(0,10).map(e=>`<div class="lb-row"><span>${escapeHtml(e.team)}</span><span>${formatTime(e.seconds)}</span></div>`).join("") +
    `<p class="lb-note">Classement enregistré sur cet appareil.</p>`;
}

function render(){
  renderProgress();
  renderCodebook();
  if(state.screen==="intro") renderIntro();
  else if(state.screen==="stage") renderStage();
  else if(state.screen==="outro"){ renderOutro(); renderSuspectBoard(); }
  else if(state.screen==="vault"){ renderVault(); renderSuspectBoard(); }
  else if(state.screen==="success"){ renderSuccess(); renderSuspectBoard(); }
}

timerDisplay.textContent = formatTime(state.timeLeft);
render();
</script>
</body>
</html>

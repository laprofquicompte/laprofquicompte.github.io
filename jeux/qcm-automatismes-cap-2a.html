const quizResults = {};
let curGroup = null, curQuiz = null;
let itemIdx = 0;
let answers = [];
let score = 0;

function escapeHTML(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function renderMenu() {
  const main = document.getElementById("content");
  let html = "";
  GROUPS.forEach((g, gi) => {
    html += "<div class='group-section'>";
    html += "<div class='group-title'>" + escapeHTML(g.name) + "</div>";
    html += "<div class='quiz-grid'>";
    g.quizzes.forEach((q, qi) => {
      const key = gi + "-" + qi;
      const res = quizResults[key];
      html += "<div class='quiz-card' onclick='startQuiz(" + gi + "," + qi + ")'>";
      html += "<div class='qc-badge'>QCM</div>";
      html += "<div class='qc-label'>" + q.label + "</div>";
      html += "<div class='qc-count'>" + q.count + " questions</div>";
      if (res) html += "<div class='qc-score' style='color:" + (res.score/res.total>=0.6 ? 'var(--teal)' : 'var(--red)') + "'>Dernier score : " + res.score + "/" + res.total + "</div>";
      html += "</div>";
    });
    html += "</div></div>";
  });
  main.innerHTML = html;
}

function startQuiz(gi, qi) {
  curGroup = gi; curQuiz = qi; itemIdx = 0; score = 0;
  const quiz = GROUPS[gi].quizzes[qi];
  answers = new Array(quiz.items.length).fill(null);
  renderQuiz();
}

function renderQuiz() {
  const quiz = GROUPS[curGroup].quizzes[curQuiz];
  const items = quiz.items;
  const main = document.getElementById("content");

  if (itemIdx >= items.length) {
    renderRecap();
    return;
  }

  const item = items[itemIdx];
  let html = "<a class='backlink' onclick='renderMenu()'>&#9664; Retour au menu</a>";
  html += "<div class='statusbar'><span>QUESTION " + (itemIdx+1) + " / " + items.length + "</span>";
  html += "<div class='progress-track'><div class='progress-fill' style='width:" + Math.round((itemIdx/items.length)*100) + "%'></div></div>";
  html += "<span>SCORE " + score + "/" + items.length + "</span></div>";
  html += "<div class='card'>";
  html += "<div><span class='qc-tag'>" + escapeHTML(item.domain) + "</span>";
  html += "<span class='theme-label'>" + escapeHTML(item.theme) + "</span></div>";
  html += "<div class='qtext'>" + escapeHTML(item.question) + "</div>";
  if (item.image && IMAGES[item.image]) html += "<img class='qimg' src='" + IMAGES[item.image] + "'>";
  html += "<div class='choices' id='choicesBox'>";
  item.choices.forEach((c, i) => {
    html += "<button class='choice-btn' data-i='" + i + "'>" + escapeHTML(c) + "</button>";
  });
  html += "</div><div class='explanation' id='explBox'></div></div>";
  html += "<div class='nav-row'>";
  html += "<button class='nav-btn secondary' id='prevBtn' " + (itemIdx===0?"disabled":"") + ">&#9664; Précédent</button>";
  html += "<button class='nav-btn' id='nextBtn' disabled>Suivant &#9654;</button>";
  html += "</div>";
  main.innerHTML = html;

  main.querySelectorAll(".choice-btn").forEach((btn) => {
    btn.onclick = () => selectAnswer(parseInt(btn.dataset.i, 10));
  });
  document.getElementById("nextBtn").onclick = () => { itemIdx++; renderQuiz(); };
  document.getElementById("prevBtn").onclick = () => { if (itemIdx>0) { itemIdx--; renderQuiz(); } };

  if (answers[itemIdx] !== null) {
    revealAnswer(item, answers[itemIdx]);
    document.getElementById("nextBtn").disabled = false;
  }
}

function selectAnswer(choiceIdx) {
  const quiz = GROUPS[curGroup].quizzes[curQuiz];
  const item = quiz.items[itemIdx];
  if (answers[itemIdx] !== null) return;
  answers[itemIdx] = choiceIdx;
  if (choiceIdx === item.correctIndex) score++;
  revealAnswer(item, choiceIdx);
  document.querySelector(".statusbar span:last-child").textContent = "SCORE " + score + "/" + quiz.items.length;
  document.getElementById("nextBtn").disabled = false;
}

function revealAnswer(item, chosenIdx) {
  document.querySelectorAll(".choice-btn").forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correctIndex) btn.classList.add("correct");
    else if (i === chosenIdx) btn.classList.add("wrong");
  });
  const expl = document.getElementById("explBox");
  expl.style.display = "block";
  expl.textContent = "Réponse : " + item.explanation;
}

function renderRecap() {
  const quiz = GROUPS[curGroup].quizzes[curQuiz];
  quizResults[curGroup + "-" + curQuiz] = { score, total: quiz.items.length };
  const pct = Math.round((score / quiz.items.length) * 100);
  const main = document.getElementById("content");
  main.innerHTML =
    "<a class='backlink' onclick='renderMenu()'>&#9664; Retour au menu</a>" +
    "<div class='card recap'>" +
    "<div class='recap-title'>" + GROUPS[curGroup].name + " — " + quiz.label + " terminé !</div>" +
    "<div class='score'>" + score + " / " + quiz.items.length + "</div>" +
    "<div class='pct'>" + pct + " % de bonnes réponses</div>" +
    "<div class='recap-actions'>" +
    "<button class='nav-btn' onclick='startQuiz(" + curGroup + "," + curQuiz + ")'>Recommencer ce QCM</button>" +
    "<button class='nav-btn secondary' onclick='renderMenu()'>Retour au menu</button>" +
    "</div></div>";
}

renderMenu();
</script>
</body>
</html>
